[project]
name = "ninebar"
version = "0.1.0"
description = "Incremental, replay-safe telecom pipeline on the Telecom Italia open CDR dataset"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1,<1.2", "sqlglot>=25", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ninebar = "ninebar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
